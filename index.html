<!DOCTYPE html>
<html>
    <head>
        <title>Priscilla's page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
          <h1 id="page-heading">Priscilla</h1>
          <p>I'm learning web development, one line at a time.</p>
          <img src="https://placehold.co/200" alt="Placeholder profile photo">
        </header>
        <p id="joke-text">Loading joke...</p>
        <button id="new-joke-btn">new joke</button>
       
       
         <main>
            <div>
                <input type="text" id="skill-input" placeholder="Add new skill">
                <button id="add-skill-btn">Add</button>
            </div>
             <div class="grid">
             </div>
        </main>
        
        <footer>
          <a href="https://github.com">My Github</a>  
        </footer>
       

       <button id="open-btn">open popup</button>
       <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <p>This is a popup! it sits on top of everything else</p>
            <button id="close-btn">close</button>
        </div>
       </div>
        <script src="script.js"></script>
    </body>
</html>
